# Tests and style checks on every push and pull request. The VM serves whatever reaches master
# within a minute, so a red mark here is the warning before (or right after) it goes live.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 with Python 3.12 is what the VM runs; Windows is the PC (and the portable ZIP).
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  lint:
    name: Style (Ruff, Prettier, ESLint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.16.9 check .
      - run: uvx ruff@0.16.9 format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
