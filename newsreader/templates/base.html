<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="format-detection" content="telephone=no"><meta name="csrf-token" content="{{ csrf_token() }}"><meta name="translation-targets" content="{{ translation_targets_json }}"><meta name="application-name" content="{{ app_name }}"><meta name="apple-mobile-web-app-title" content="{{ app_name }}"><script>{{ theme_boot|safe }}</script>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1b1d22" media="(prefers-color-scheme: dark)">
{% block head %}{% endblock %}<link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml"><link rel="stylesheet" href="{{ asset('style.css') }}"></head>
<body id="top"><header class="topbar"><div class="wrap brand"><a class="brand-link" href="{{ url_for('index') }}"><span class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 42h46M14 42Q32 6 50 42" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M24 29v13M32 25v17M40 29v13" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></span><span>{{ app_name }} <small>{{ app_tagline }}</small></span></a>
<nav class="topnav" aria-label="メインメニュー">{% block nav %}<a class="nav-text" href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>記事</a><a class="nav-text" href="{{ url_for('stories_page') }}"{% if request.endpoint in ('stories_page', 'story_page') %} aria-current="page"{% endif %}>読み比べ</a><a class="status-badge tone-{{ status_badge.tone }}" href="{{ url_for('status_page') }}" title="{{ status_badge.title }}"{% if request.endpoint == 'status_page' %} aria-current="page"{% endif %}>{{ status_badge.label }}</a><button type="button" class="theme-toggle" id="theme-toggle" aria-label="テーマ: 自動（端末の設定に合わせる）" title="テーマ: 自動"><svg class="icon-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg><svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" fill="currentColor"/></svg></button><a class="settings-nav nav-text" href="{{ url_for('translation_settings') }}"{% if request.endpoint == 'translation_settings' %} aria-current="page"{% endif %}>設定</a>{% endblock %}</nav></div></header>
<main class="wrap{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
<nav class="tabbar" aria-label="メインメニュー（下）"><a href="{{ url_for('index') }}"{% if request.endpoint in ('index', 'show_article') %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 9h10M7 12.5h10M7 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>記事</span></a><a href="{{ url_for('stories_page') }}"{% if request.endpoint in ('stories_page', 'story_page') %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="7.5" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="5" width="7.5" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>読み比べ</span></a><a href="{{ url_for('status_page') }}"{% if request.endpoint == 'status_page' %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12h4l2.5-6 4 12 2.5-6h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>状態</span></a><a href="{{ url_for('translation_settings') }}"{% if request.endpoint == 'translation_settings' %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>設定</span></a></nav>
{% block scripts %}{% endblock %}<script type="speculationrules">{{ speculation_rules|safe }}</script><script src="{{ asset('app.js') }}" defer></script></body></html>
