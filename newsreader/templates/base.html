<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="format-detection" content="telephone=no"><meta name="app-base" content="{{ request.script_root }}"><meta name="csrf-token" content="{{ csrf_token() }}"><meta name="translation-targets" content="{{ translation_targets_json }}"><meta name="application-name" content="{{ app_name }}"><meta name="app-version" content="{{ app_version }}"><meta name="apple-mobile-web-app-title" content="{{ app_name }}"><script>{{ theme_boot|safe }}</script>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1b1d22" media="(prefers-color-scheme: dark)">
{% block head %}{% endblock %}<link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml"><link rel="stylesheet" href="{{ asset('style.css') }}"><link rel="stylesheet" href="{{ asset('editorial.css') }}"></head>
<body id="top"><header class="topbar"><div class="wrap brand"><a class="brand-link" href="{{ url_for('index') }}"><span class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 42h46M14 42Q32 6 50 42" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M24 29v13M32 25v17M40 29v13" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></span><span>{{ app_name }}{% if build_channel %} <span class="badge build-badge" title="配布用のテスト版（{{ build_channel }}）">テスト版</span>{% endif %} <small>{{ app_tagline }}</small></span></a>
<nav class="topnav" aria-label="メインメニュー">{% block nav %}<a class="nav-text" href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>記事</a><a class="nav-text" href="{{ url_for('stories_page') }}"{% if request.endpoint in ('stories_page', 'story_page') %} aria-current="page"{% endif %}>読み比べ</a><a class="nav-text" href="{{ url_for('digest_page') }}"{% if request.endpoint in ('digest_page', 'outlets_page') %} aria-current="page"{% endif %}>今日</a><a class="status-badge tone-{{ status_badge.tone }}" href="{{ url_for('status_page') }}" title="{{ status_badge.title }}"{% if request.endpoint == 'status_page' %} aria-current="page"{% endif %}>{{ status_badge.label }}</a><button type="button" class="theme-toggle" id="theme-toggle" aria-label="テーマ: 自動（端末の設定に合わせる）" title="テーマ: 自動">配色 自動</button><a class="settings-nav nav-text" href="{{ url_for('translation_settings') }}"{% if request.endpoint == 'translation_settings' %} aria-current="page"{% endif %}>設定</a>{% endblock %}</nav></div></header>
<main class="wrap{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
<nav class="tabbar" aria-label="メインメニュー（下）"><a href="{{ url_for('index') }}"{% if request.endpoint in ('index', 'show_article') %} aria-current="page"{% endif %}>記事</a><a href="{{ url_for('stories_page') }}"{% if request.endpoint in ('stories_page', 'story_page') %} aria-current="page"{% endif %}>読み比べ</a><a href="{{ url_for('digest_page') }}"{% if request.endpoint in ('digest_page', 'outlets_page') %} aria-current="page"{% endif %}>今日</a><a href="{{ url_for('translation_settings') }}"{% if request.endpoint == 'translation_settings' %} aria-current="page"{% endif %}>設定</a></nav>
{% block scripts %}{% endblock %}<script type="speculationrules">{{ speculation_rules|safe }}</script><script src="{{ asset('app.js') }}" defer></script></body></html>
